<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="color-scheme" content="dark" />
  <title>Audi F1 Team × Digital Realty — Swiss infrastructure planning tool</title>
  <meta name="description" content="Plan the Audi F1 Team's Swiss infrastructure for the 2027 and 2028 seasons: the Restricted CFD cluster, the Digital Realty Zurich facility, connectivity, the deployment timeline and the commercials inside the FIA envelope, with a Solutions Architect view." />
  <link rel="icon" href="data:," />
  <link rel="stylesheet" href="/css/sim.css" />
</head>
<body class="sim-page">
  <a class="skip" href="#main">Skip to the content</a>
  <div id="sim-root">
    <noscript>
      <div class="file-warning">This page needs JavaScript. Open it through the local server: <code>sh start.command</code>, then <a href="http://localhost:8090/">http://localhost:8090/</a>.</div>
    </noscript>
    <div id="sim-loading" class="loading" aria-live="polite">Loading the planning tool…</div>
  </div>
  <script>
    if (location.protocol === "file:") {
      document.getElementById("sim-loading").innerHTML = "This page must be served by the local server (ES modules do not load from file://). Run <code>sh start.command</code> and open <a href=\"http://localhost:8090/\">http://localhost:8090/</a>."
    }
  </script>
  <script type="module">
    import { mountSim } from "/js/sim/app.js"
    const root = document.getElementById("sim-root")
    try {
      mountSim(root)
    } catch (err) {
      const loading = document.getElementById("sim-loading")
      if (loading) loading.textContent = `The planning tool could not start: ${err && err.message ? err.message : err}`
      console.error(err)
      throw err
    }
  </script>
</body>
</html>
